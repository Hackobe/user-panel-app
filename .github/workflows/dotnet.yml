name: .NET build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore UserPanelApp.sln
      - name: Build
        run: dotnet build UserPanelApp.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test UserPanelApp.sln --configuration Release --no-build
